[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyllm-cli"
version = "1.0.0"
description = "One terminal chat client for any LLM API key"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "cli", "terminal", "openai", "anthropic", "gemini"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
anyllm = "anyllm.cli:main"

[tool.setuptools]
packages = ["anyllm"]
